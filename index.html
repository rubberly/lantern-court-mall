<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Walk through Lantern Court, a two-level 3D mall with 36 shops, stairs, glass elevators and a food court.">
<title>Lantern Court Mall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D canvas, floating HUD chips at the corners, product card as a bottom sheet. Single deliberate light look. */
:root{
  --ink:#1f1b2e; --panel:#fffaf3; --panel-line:#eadfce; --muted:#6c6479;
  --accent:#d9572b; --accent-ink:#ffffff; --ground:#cdbfa9;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap;max-width:calc(100% - 170px)}
.chip{background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:0 4px 14px rgb(31 27 46 / .12)}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
#dirBtn{font-weight:600}
button:focus-visible,#card a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#level{font-family:var(--display);font-weight:700;background:var(--ink);color:#fff;border-color:var(--ink)}
#where{font-weight:600}
#map{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:120px;height:182px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 4px 14px rgb(31 27 46 / .12)}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;color:var(--muted)}
#act{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 60px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;box-shadow:0 8px 22px rgb(217 87 43 / .35)}
#act:disabled{background:var(--ink);opacity:.85;box-shadow:none;cursor:default}
#act kbd{font:600 11px var(--body);background:rgb(255 255 255 / .25);border-radius:5px;padding:2px 6px;margin-left:8px}
#dir{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 60px);left:max(12px,env(safe-area-inset-left,0px));width:min(300px,calc(100% - 24px));max-height:calc(100% - 140px);overflow:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgb(31 27 46 / .18)}
#dir h3{margin:6px 0 4px;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#dir ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:2px}
.go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 8px}
.go:hover{background:#f2e8da}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.go small{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;transform:translate(14px,14px)}
#card{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100% - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:18px 18px 16px;box-shadow:0 18px 40px rgb(31 27 46 / .25);display:grid;gap:6px}
#card .st{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#card h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.15;text-wrap:balance;padding-right:30px}
#card .price{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
#card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
#card a{margin-top:6px;display:block;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:11px;border-radius:12px}
#card small{color:var(--muted);font-size:11.5px;text-align:center}
#close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--panel-line);background:#fff;font-size:18px;line-height:1}
#stick{position:fixed;z-index:4;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgb(255 250 243 / .35);border:2px solid rgb(255 250 243 / .8);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--panel);box-shadow:0 3px 10px rgb(0 0 0 / .2)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink);z-index:9;background:var(--ground)}
@media (max-width:560px){#help{white-space:normal;text-align:center;width:calc(100% - 32px);box-sizing:border-box} #map{width:92px;height:140px} #top{max-width:calc(100% - 120px)} #act{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
</style>
</head>

<canvas id="c" tabindex="0" aria-label="3D mall. Use arrow keys or WASD to walk, drag to look around, click a product to see it."></canvas>
<div id="loading">Opening the doors…</div>

<div class="hud" id="top">
  <div class="chip brand">Lantern <span>Court</span></div>
  <button class="chip" id="dirBtn" aria-expanded="false" aria-controls="dir">Directory</button>
  <div class="chip" id="level">Level 1</div>
  <div class="chip" id="where" hidden></div>
</div>
<canvas id="map" width="240" height="364" aria-hidden="true"></canvas>
<div id="dir" hidden></div>
<button id="act" hidden></button>
<div class="hud chip" id="help">Drag to look · WASD or arrows to walk · Shift to hurry · Click a product · E for elevator</div>
<div id="tip" hidden></div>
<div id="stick" hidden><div id="knob"></div></div>

<div id="card" hidden role="dialog" aria-labelledby="cardName">
  <button id="close" aria-label="Close product">×</button>

  <div class="price" id="cardPrice"></div>
  <p id="cardDesc"></p>
  <a id="cardLink" href="#" target="_blank" rel="noopener">Find one online</a>
  <small>Example prices. The button opens a product search.</small>
</div>

const colliders = [];
function addCol(x0,x1,z0,z1,y0,y1){ colliders.push({x0,x1,z0,z1,y0,y1}); }
const batches = new Map();
function sbox(x,y,z,w,h,d,color,collide,glass){
  const key = color+(glass?'g':'');
  let b = batches.get(key);
  if(!b){ b={color,glass,pos:[],nor:[],idx:[],n:0}; batches.set(key,b); }
  const g = new THREE.BoxGeometry(w,h,d); g.translate(x,y,z);
  const p=g.attributes.position.array, nn=g.attributes.normal.array, ix=g.index.array;
  for(let i=0;i<p.length;i++){ b.pos.push(p[i]); b.nor.push(nn[i]); }
  for(let i=0;i<ix.length;i++) b.idx.push(ix[i]+b.n);
  b.n += p.length/3; g.dispose();
  if(collide) addCol(x-w/2,x+w/2,z-d/2,z+d/2,y-h/2,y+h/2);
}
function flushBatches(){
  batches.forEach(b=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor,3));
    g.setIndex(b.idx);
    const m = b.glass ? new THREE.MeshLambertMaterial({color:b.color, transparent:true, opacity:.28, depthWrite:false})
                      : new THREE.MeshLambertMaterial({color:b.color});
    const mesh = new THREE.Mesh(g,m); if(b.glass) mesh.renderOrder = 2; scene.add(mesh);
  });
  batches.clear();
}
function textTexture(text, bg, fg, w=512, h=128, font='800 64px Outfit, system-ui, sans-serif'){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const g = cv.getContext('2d');
  if(bg){ g.fillStyle=bg; g.fillRect(0,0,w,h); }
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
  let size = parseInt(font.match(/(\d+)px/)[1]);
  g.font = font;
  while(g.measureText(text).width > w*0.86 && size>16){ size-=2; g.font = font.replace(/\d+px/, size+'px'); }
  g.fillText(text, w/2, h/2+2);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;

  const r = canvas.getBoundingClientRect();

  ray.setFromCamera(ndc, camera);

const pointers = new Map();

const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
canvas.addEventListener('pointerdown', e=>{
  canvas.focus({preventScroll:true});
  const touchMove = e.pointerType==='touch' && e.clientX < innerWidth/2 && e.clientY > innerHeight*.35;
  pointers.set(e.pointerId, {sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY, t:performance.now(), mode: touchMove?'stick':'look', moved:0});
  if(touchMove){ stickEl.style.left=e.clientX+'px'; stickEl.style.top=e.clientY+'px'; stickEl.hidden=false; }
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p){ if(e.pointerType==='mouse') hover(e.clientX,e.clientY); return; }
  const dx=e.clientX-p.lx, dy=e.clientY-p.ly; p.lx=e.clientX; p.ly=e.clientY;
  p.moved = Math.max(p.moved, Math.hypot(e.clientX-p.sx, e.clientY-p.sy));
  if(p.mode==='look'){
    const k = e.pointerType==='touch' ? .006 : .0045;
    player.yaw -= dx*k; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy*k));
    hideTip();
  } else {
    let vx=e.clientX-p.sx, vy=e.clientY-p.sy; const Ln=Math.hypot(vx,vy), m=45;
    if(Ln>m){ vx*=m/Ln; vy*=m/Ln; }
    knob.style.transform=`translate(${vx}px,${vy}px)`;
    stickVec={x:vx/m, y:vy/m};
  }
});
function endPointer(e){
  const p = pointers.get(e.pointerId); if(!p) return;
  pointers.delete(e.pointerId);
  if(p.mode==='stick'){ stickVec={x:0,y:0}; knob.style.transform=''; stickEl.hidden=true; }
  if(e.type==='pointerup' && p.moved<8 && performance.now()-p.t<500){
    const o = pick(e.clientX,e.clientY);
    if(o) openCard(o.userData.item, o.userData.store); else closeCard();
  }
}

  document.getElementById('cardName').textContent = it.n;
  document.getElementById('cardPrice').textContent = fmt(it.p);
  document.getElementById('cardDesc').textContent = st.tag+' at '+st.name+', on Level '+(st.level+1)+' of Lantern Court.';
  const a = document.getElementById('cardLink');
  a.href = 'https://www.amazon.com/s?k='+encodeURIComponent(it.n);
  a.style.background = st.color;
  card.hidden = false; hideTip();
}
function closeCard(){ card.hidden = true; }
document.getElementById('close').addEventListener('click', ()=>{ closeCard(); canvas.focus(); });

// ---------------- Directory ----------------
const dir = document.getElementById('dir'), dirBtn = document.getElementById('dirBtn');
[0,1].forEach(lv=>{
  const h=document.createElement('h3'); h.textContent='Level '+(lv+1); dir.appendChild(h);
  const ul=document.createElement('ul'); dir.appendChild(ul);
  STORES.filter(s=>s.level===lv).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(st=>{
    const li=document.createElement('li'); const b=document.createElement('button'); b.className='go';
    b.innerHTML = '<span class="sw"></span><span></span><small></small>';
    b.children[0].style.background = st.color; b.children[1].textContent = st.name; b.children[2].textContent = st.tag;
    b.addEventListener('click', ()=>{
      player.x = st.fx - st.nx*3; player.z = st.fz - st.nz*3; player.y = st.level*FH; player.vy=0;
      player.yaw = Math.atan2(-st.nx,-st.nz); player.pitch=-0.05;
      toggleDir(false); closeCard(); canvas.focus();
    });
    li.appendChild(b); ul.appendChild(li);
  });
});
function toggleDir(v){ dir.hidden = !v; dirBtn.setAttribute('aria-expanded', String(v)); }
dirBtn.addEventListener('click', ()=> toggleDir(dir.hidden));

// ---------------- Elevator action button ----------------
const actBtn = document.getElementById('act');
let lastActKey = '';
actBtn.addEventListener('click', ()=>{ if(curAction) curAction.run(); canvas.focus(); });
function sendElev(e, y){ if(e.moving || Math.abs(e.y-y)<.01) return; e.target=y; e.moving=true; }
function nearDoor(e){ return Math.abs(player.x-e.s*11.2)<1.8 && Math.abs(player.z)<2.2; }
function updateAction(){
  let a = null;
  const L0 = lvl();
  for(const e of ELEV){
    if(e.moving && (inCab(e,player.x,player.z) || nearDoor(e))){ a={key:'mv',label:'Elevator moving…',disabled:true}; break; }
    if(!e.moving && inCab(e,player.x,player.z) && Math.abs(player.y-e.y)<.3){
      const to = e.y<FH/2 ? FH : 0;
      a={key:'ride'+e.s+to,label:'Ride to Level '+(to?2:1),run:()=>sendElev(e,to)}; break;
    }
    if(!e.moving && nearDoor(e) && Math.abs(e.y-L0*FH)>.01){
      a={key:'call'+e.s+L0,label:'Call elevator',run:()=>sendElev(e,L0*FH)}; break;
    }
  }
  curAction = a && !a.disabled ? a : null;
  const k = a ? a.key : '';
  if(k!==lastActKey){
    lastActKey=k;
    if(!a){ actBtn.hidden=true; }
    else {
      actBtn.hidden=false; actBtn.disabled=!!a.disabled; actBtn.textContent=a.label;
      if(!a.disabled && !coarse){ const kb=document.createElement('kbd'); kb.textContent='E'; actBtn.appendChild(kb); }
    }
  }
}

// ---------------- Minimap ----------------
const map = document.getElementById('map'), mg = map.getContext('2d');
function drawMap(){
  const W=map.width, H=map.height, pad=10, s=Math.min((W-2*pad)/64,(H-2*pad)/100);
  const ox=(W-64*s)/2, oz=(H-100*s)/2;
  const X = x=> ox+(x+32)*s, Z = z=> oz+(z+50)*s;
  const lv = lvl();
  mg.clearRect(0,0,W,H);
  mg.fillStyle='#efe6d8'; mg.fillRect(X(-18),Z(-36),36*s,72*s);
  if(lv===1){ mg.fillStyle='#dcefff'; mg.fillRect(X(-10),Z(-28),20*s,56*s); }
  else { mg.fillStyle='#e4dccd'; mg.fillRect(X(-10),Z(-28),20*s,56*s); mg.fillStyle='#6fb6d8'; mg.beginPath(); mg.arc(X(0),Z(0),2.4*s,0,7); mg.fill(); }
  mg.fillStyle='#bfb19a'; mg.fillRect(X(-3),Z(16),6*s,12*s); mg.fillRect(X(-3),Z(-28),6*s,12*s);
  mg.fillStyle='#5d6470'; ELEV.forEach(e=>mg.fillRect(X(Math.min(e.s*7,e.s*10)),Z(-1.5),3*s,3*s));
  STORES.forEach(st=>{
    if(st.level!==lv) return;
    const a=L(st,-6,0), b=L(st,6,14);
    const x0=Math.min(a[0],b[0]), x1=Math.max(a[0],b[0]), z0=Math.min(a[1],b[1]), z1=Math.max(a[1],b[1]);
    mg.fillStyle = st.color+'40'; mg.fillRect(X(x0),Z(z0),(x1-x0)*s,(z1-z0)*s);
    mg.strokeStyle = st.color; mg.lineWidth=1.5; mg.strokeRect(X(x0)+1,Z(z0)+1,(x1-x0)*s-2,(z1-z0)*s-2);
  });
  const px=X(player.x), pz=Z(player.z);
  const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw), an=Math.atan2(fz,fx);
  mg.fillStyle='rgba(217,87,43,.3)'; mg.beginPath(); mg.moveTo(px,pz); mg.arc(px,pz,22,an-.5,an+.5); mg.closePath(); mg.fill();
  mg.fillStyle='#1f1b2e'; mg.beginPath(); mg.arc(px,pz,5,0,7); mg.fill(); mg.strokeStyle='#fff'; mg.lineWidth=2; mg.stroke();
}

// ---------------- HUD: level + where ----------------
const where = document.getElementById('where'), levelChip = document.getElementById('level');
let lastWhere='', lastLvl=-1;
function updateWhere(){
  const lv = lvl();
  if(lv!==lastLvl){ lastLvl=lv; levelChip.textContent='Level '+(lv+1); }
  let txt='';
  for(const st of STORES){
    if(st.level!==lv) continue;
    const dx=player.x-st.fx, dz=player.z-st.fz, v=dx*st.nx+dz*st.nz, u=dx*st.tx+dz*st.tz;
    if(v>0.2 && v<14 && Math.abs(u)<6){ txt='In '+st.name; break; }
  }
  if(!txt && lv===0 && inAtrium(player.x,player.z) && Math.abs(player.z)<14) txt='Food Court';
  if(txt!==lastWhere){ lastWhere=txt; where.hidden=!txt; where.textContent=txt; }
}
if(coarse) document.getElementById('help').textContent = 'Left thumb to walk · drag right side to look · tap a product';

// ---------------- Loop ----------------
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
function step(dt){
  t+=dt;
  for(const e of ELEV){
    if(e.moving){
      const riding = inCab(e,player.x,player.z) && Math.abs(player.y-e.y)<.5;
      const st = 2.6*dt*Math.sign(e.target-e.y);
      if(Math.abs(e.target-e.y)<=Math.abs(st)){ e.y=e.target; e.moving=false; } else e.y+=st;
      if(riding){ player.y=e.y; player.vy=0; }
    }
    e.mesh.position.y = e.y;
  }
  let f=0, r=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD) r+=1; if(keys.KeyA) r-=1;
  if(keys.ArrowLeft) player.yaw += 1.8*dt; if(keys.ArrowRight) player.yaw -= 1.8*dt;
  f -= stickVec.y; r += stickVec.x;
  const len = Math.hypot(f,r);
  if(len>.05){
    if(len>1){ f/=len; r/=len; }
    const sp = (keys.ShiftLeft||keys.ShiftRight ? 9 : 5)*dt;
    const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    move((-sy*f + cy*r)*sp, (-cy*f - sy*r)*sp);
  }
  const ground = surfaceAt(player.x, player.z, player.y);
  if(player.y > ground + .02){ player.vy -= 22*dt; player.y += player.vy*dt; if(player.y<=ground){ player.y=ground; player.vy=0; } }
  else { player.y = ground; player.vy = 0; }
  camera.position.set(player.x, player.y + 1.65 + (len>.05 ? Math.sin(t*9)*.03 : 0), player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  if(!reduceMotion) for(const m of spinners) m.rotation.y += dt*.6;
}
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last=now;
  step(dt);
  renderer.render(scene,camera);
  drawMap(); updateWhere(); updateAction();
  requestAnimationFrame(frame);
}
// test hook: lets an automated check drive the player and render a frame
window.__mall = {player, ELEV, keys, sendElev, step, render:()=>{ renderer.render(scene,camera); drawMap(); updateWhere(); updateAction(); }};
document.getElementById('loading').hidden = true;
canvas.style.cursor='grab';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
