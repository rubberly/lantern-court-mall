<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Walk through Lantern Court, a small 3D mall with six stores and clickable products.">
<title>Lantern Court Mall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D canvas, floating HUD chips at the corners, product card as a bottom sheet. Single deliberate light look. */
:root{
  --ink:#1f1b2e; --panel:#fffaf3; --panel-line:#eadfce; --muted:#6c6479;
  --accent:#d9572b; --accent-ink:#ffffff; --ground:#cdbfa9;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap;max-width:calc(100% - 170px)}
.chip{background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:0 4px 14px rgb(31 27 46 / .12)}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
#dirBtn{font-weight:600}
#dirBtn:focus-visible,.go:focus-visible,#close:focus-visible,#card a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#where{font-weight:600}
#where[hidden]{display:none!important}
#map{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:132px;height:176px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 4px 14px rgb(31 27 46 / .12)}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;color:var(--muted)}
#dir{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 60px);left:max(12px,env(safe-area-inset-left,0px));width:min(280px,calc(100% - 24px));background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgb(31 27 46 / .18)}
#dir h3{margin:0 0 4px;font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#dir ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px}
.go:hover{background:#f2e8da}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.go small{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;transform:translate(14px,14px)}
#card{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:18px 18px 16px;box-shadow:0 18px 40px rgb(31 27 46 / .25);display:grid;gap:6px}
#card .st{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#card h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.15;text-wrap:balance;padding-right:30px}
#card .price{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
#card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
#card a{margin-top:6px;display:block;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:11px;border-radius:12px}
#card small{color:var(--muted);font-size:11.5px;text-align:center}
#close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--panel-line);background:#fff;font-size:18px;line-height:1}
#stick{position:fixed;z-index:4;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgb(255 250 243 / .35);border:2px solid rgb(255 250 243 / .8);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--panel);box-shadow:0 3px 10px rgb(0 0 0 / .2)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink);z-index:9;background:var(--ground)}
@media (max-width:520px){#help{white-space:normal;text-align:center;width:calc(100% - 32px)} #map{width:100px;height:134px} #top{max-width:calc(100% - 130px)}}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="3D mall. Use arrow keys or WASD to walk, drag to look around, click a product to see it."></canvas>
<div id="loading">Opening the doors…</div>

<div class="hud" id="top">
  <div class="chip brand">Lantern <span>Court</span></div>
  <button class="chip" id="dirBtn" aria-expanded="false" aria-controls="dir">Directory</button>
  <div class="chip" id="where" hidden></div>
</div>
<canvas id="map" width="264" height="352" aria-hidden="true"></canvas>
<div id="dir" hidden><h3>Store directory</h3><ul id="dirList"></ul></div>
<div class="hud chip" id="help">Drag to look · WASD or arrow keys to walk · Shift to hurry · Click a product</div>
<div id="tip" hidden></div>
<div id="stick" hidden><div id="knob"></div></div>

<div id="card" hidden role="dialog" aria-labelledby="cardName">
  <button id="close" aria-label="Close product">×</button>
  <div class="st" id="cardStore"></div>
  <h2 id="cardName"></h2>
  <div class="price" id="cardPrice"></div>
  <p id="cardDesc"></p>
  <a id="cardLink" href="#" target="_blank" rel="noopener">Find one online</a>
  <small>Example prices. The button opens a product search.</small>
</div>

<script>
function mallFail(msg){ var l=document.getElementById('loading'); if(!l) return; l.hidden=false; l.style.cssText+=';padding:24px;text-align:center;font-size:16px;line-height:1.5'; l.innerHTML='<div style="max-width:460px"><b style="font-size:20px">The mall couldn’t open</b><br>'+msg+'</div>'; }
(function(){ var ok=false; try{ var c=document.createElement('canvas'); ok=!!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }catch(e){}
 if(!ok){ window.__noGL=true; setTimeout(function(){ mallFail('Your browser has 3D graphics (WebGL) turned off or blocked.<br><br>In Chrome or Edge: open Settings → System, turn on <b>Use graphics acceleration when available</b>, then restart the browser.'); },0); } })();
window.addEventListener('error', function(e){ if(window.__noGL) return; mallFail('Error: '+(e.message||'a file failed to load')+'<br><br>Tell Claude this exact message.'); }, true);
</script>
<script src="three.min.js" onerror="mallFail('The 3D library (three.min.js) didn’t load. Keep it in the same folder as this page.')"></script>
<script>
if(window.THREE && !window.__noGL) (function(){
const STORES = [
  {name:'Sneaker Shop', tag:'Footwear', color:'#d9572b', side:-1, zc:-20, items:[
    {n:'Classic white sneakers', p:65, d:'Clean leather low-tops that go with everything.', g:['box',.9,.45,.4], c:0xf7f4ee, q:'white leather sneakers'},
    {n:'Running shoes', p:90, d:'Light, cushioned trainers for daily miles.', g:['box',.9,.45,.4], c:0x3b7dd8, q:'running shoes'},
    {n:'Canvas high-tops', p:75, d:'Ankle-height canvas classics in deep red.', g:['box',.8,.7,.4], c:0xb3262e, q:'canvas high top sneakers'},
    {n:'Pool slides', p:25, d:'Soft foam slides for the pool or the locker room.', g:['box',.8,.2,.35], c:0x222222, q:'slide sandals'},
    {n:'Crew socks, 6-pack', p:14, d:'Cushioned cotton crews, six pairs.', g:['cyl',.25,.7], c:0xeeeeee, q:'crew socks 6 pack'}]},
  {name:'Tech Store', tag:'Electronics', color:'#2f6fd0', side:-1, zc:0, items:[
    {n:'Wireless earbuds', p:49, d:'Pocket case, 24 hours of battery with charges.', g:['sphere',.3], c:0xffffff, q:'wireless earbuds'},
    {n:'Fast phone charger', p:19, d:'USB-C wall charger that fills a phone in about an hour.', g:['box',.35,.35,.35], c:0xdedede, q:'usb c fast charger'},
    {n:'Mechanical keyboard', p:69, d:'Clicky switches and a compact layout.', g:['box',1.1,.12,.4], c:0x2b2b33, q:'mechanical keyboard'},
    {n:'Smart watch', p:129, d:'Tracks steps, sleep, and heart rate.', g:['cyl',.28,.12], c:0x111111, q:'smart watch'},
    {n:'Portable speaker', p:39, d:'Waterproof speaker that clips to a bag.', g:['cyl',.25,.6], c:0x1fa58a, q:'portable bluetooth speaker'}]},
  {name:'Game Store', tag:'Games', color:'#7a46c9', side:-1, zc:20, items:[
    {n:'Wireless controller', p:59, d:'Works with PC and most consoles.', g:['box',.7,.25,.45], c:0x2a2a2a, q:'wireless game controller'},
    {n:'Gaming headset', p:45, d:'Over-ear headset with a flip-up mic.', g:['torus',.32,.07], c:0xd13c3c, q:'gaming headset'},
    {n:'Strategy board game', p:29, d:'2–4 players, about an hour a game.', g:['box',.8,.18,.8], c:0xe2b23a, q:'strategy board game'},
    {n:'Speed puzzle cube', p:10, d:'Smooth-turning 3×3 for speedsolving.', g:['box',.4,.4,.4], c:0x29a3d6, q:'speed cube 3x3'},
    {n:'Retro handheld', p:65, d:'Pocket console for classic-style games.', g:['box',.45,.7,.15], c:0xc9c4d6, q:'retro handheld game console'}]},
  {name:'Book Nook', tag:'Books', color:'#2e8a57', side:1, zc:-20, items:[
    {n:'Mystery novel', p:16, d:'A page-turner set in a snowed-in hotel.', g:['box',.5,.75,.15], c:0x24344f, q:'mystery novel bestseller'},
    {n:'Weeknight cookbook', p:24, d:'Thirty-minute dinners for busy nights.', g:['box',.6,.8,.12], c:0xe07a3c, q:'weeknight cookbook'},
    {n:'Sketchbook', p:12, d:'Thick paper that handles ink and markers.', g:['box',.55,.7,.08], c:0x111111, q:'sketchbook'},
    {n:'Comic collection', p:18, d:'The first story arc in one volume.', g:['box',.5,.75,.1], c:0xd9c23a, q:'graphic novel collection'},
    {n:'Clip-on reading lamp', p:22, d:'Warm LED light that clips to any book.', g:['cone',.25,.55], c:0xf0e6cf, q:'clip on book light'}]},
  {name:'Toy Shop', tag:'Toys', color:'#e0a21b', side:1, zc:0, items:[
    {n:'Building bricks set', p:40, d:'500 pieces with ideas for 3 builds.', g:['box',.6,.4,.6], c:0xd8352a, q:'building bricks set'},
    {n:'RC race car', p:35, d:'Rechargeable, about 15 mph flat out.', g:['box',.8,.3,.45], c:0x2a9d5c, q:'remote control car'},
    {n:'Plush bear', p:18, d:'Very soft and machine washable.', g:['sphere',.38], c:0xa8774b, q:'plush teddy bear'},
    {n:'Diamond kite', p:15, d:'Flies in light wind, easy for beginners.', g:['cone',.4,.7,4], c:0x3aa0e0, q:'diamond kite'},
    {n:'Art kit', p:22, d:'Markers, pencils, and crayons in a case.', g:['box',.75,.15,.5], c:0xef6fa8, q:'kids art kit'}]},
  {name:'Home Goods', tag:'Home', color:'#b5476b', side:1, zc:20, items:[
    {n:'Scented candle', p:16, d:'Cedar and vanilla, about 40 hours.', g:['cyl',.22,.4], c:0xf2e3c7, q:'scented candle'},
    {n:'Knit throw blanket', p:30, d:'Chunky knit, 50 by 60 inches.', g:['box',.8,.35,.5], c:0x9db1a2, q:'knit throw blanket'},
    {n:'Mug set of 4', p:24, d:'Stoneware mugs, dishwasher safe.', g:['cyl',.22,.35], c:0x3f6c8f, q:'stoneware mug set'},
    {n:'Desk plant', p:20, d:'A small, hard-to-kill plant in a ceramic pot.', g:['plant'], c:0xffffff, q:'small desk plant'},
    {n:'Wall clock', p:28, d:'Quiet sweep movement, 12 inches wide.', g:['cyl',.4,.08,'flat'], c:0xffffff, q:'silent wall clock'}]}
];

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e2d6);
scene.fog = new THREE.Fog(0xe9e2d6, 30, 70);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 200);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xfff8ee, 0xb8a68c, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.45); sun.position.set(4,10,6); scene.add(sun);

const colliders = [];
const mat = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.8, metalness:0}, o));
function box(x,y,z,w,h,d,material,collide){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.position.set(x,y,z); scene.add(m);
  if(collide) colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
  return m;
}
function textTexture(text, bg, fg, w=512, h=128, font='800 64px Outfit, system-ui, sans-serif'){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const g = cv.getContext('2d');
  if(bg){ g.fillStyle=bg; g.fillRect(0,0,w,h); }
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
  let size = parseInt(font.match(/(\d+)px/)[1]);
  g.font = font;
  while(g.measureText(text).width > w*0.86 && size>16){ size-=2; g.font = font.replace(/\d+px/, size+'px'); }
  g.fillText(text, w/2, h/2+2);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;
}

// Floor tiles
(function(){
  const cv=document.createElement('canvas'); cv.width=cv.height=256; const g=cv.getContext('2d');
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){ g.fillStyle=(i+j)%2?'#e6dccb':'#ddd1bd'; g.fillRect(i*64,j*64,64,64); }
  g.strokeStyle='#cbbda6'; g.lineWidth=2; for(let k=0;k<=4;k++){ g.beginPath(); g.moveTo(k*64,0); g.lineTo(k*64,256); g.moveTo(0,k*64); g.lineTo(256,k*64); g.stroke(); }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(44/8,60/8); t.encoding=THREE.sRGBEncoding;
  const f=new THREE.Mesh(new THREE.PlaneGeometry(44,60), mat(0xffffff,{map:t,roughness:.5}));
  f.rotation.x=-Math.PI/2; scene.add(f);
})();
// Ceiling + skylight
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(44,60), mat(0xf6f1e8)); ceil.rotation.x=Math.PI/2; ceil.position.y=6; scene.add(ceil);
const sky = new THREE.Mesh(new THREE.PlaneGeometry(6,56), new THREE.MeshBasicMaterial({color:0xdff0ff})); sky.rotation.x=Math.PI/2; sky.position.y=5.97; scene.add(sky);
for(let z=-26; z<=26; z+=6.5){ box(0,5.9,z,6.4,.12,.25,mat(0xcfc3b0),false); }

// Corridor end walls
const wallMat = mat(0xf1ebe1);
box(0,3,-30,12,6,.4,wallMat,true);
box(0,3,30,12,6,.4,wallMat,true);
const exitSign = new THREE.Mesh(new THREE.PlaneGeometry(4,1), new THREE.MeshBasicMaterial({map:textTexture('Food court opens soon','#1f1b2e','#ffffff')}));
exitSign.position.set(0,3.6,-29.75); scene.add(exitSign);

// Stores
const clickables = [];
const spinners = [];
const fmt = n => '$'+n;
STORES.forEach(st => {
  const s = st.side, zc = st.zc, col = new THREE.Color(st.color);
  const pastel = col.clone().lerp(new THREE.Color(0xffffff), .78);
  const storeWall = mat(pastel);
  const front = s*6;
  // front wall with a 6m doorway
  box(front,3,zc-6.5,.4,6,7,wallMat,true);
  box(front,3,zc+6.5,.4,6,7,wallMat,true);
  box(front,5,zc,.4,2,6,wallMat,false);
  // door frame trim
  box(front,4.05,zc,.5,.1,6,mat(col),false);
  box(front,2,zc-3,.5,4,.12,mat(col),false);
  box(front,2,zc+3,.5,4,.12,mat(col),false);
  // back + dividers
  box(s*22,3,zc,.4,6,20,storeWall,true);
  box(s*14,3,zc-10,16,6,.4,storeWall,true);
  box(s*14,3,zc+10,16,6,.4,storeWall,true);
  // store floor
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(16,20), mat(pastel.clone().lerp(new THREE.Color(0xd8cdbb),.4),{roughness:.6}));
  fl.rotation.x=-Math.PI/2; fl.position.set(s*14,.01,zc); scene.add(fl);
  // signs
  const signTex = textTexture(st.name, st.color, '#ffffff');
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(5.2,1.3), new THREE.MeshBasicMaterial({map:signTex}));
  sign.position.set(front - s*.22, 4.95, zc); sign.rotation.y = s<0 ? Math.PI/2 : -Math.PI/2; scene.add(sign);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(6,1.5), new THREE.MeshBasicMaterial({map:signTex}));
  back.position.set(s*21.78, 4.2, zc); back.rotation.y = s<0 ? Math.PI/2 : -Math.PI/2; scene.add(back);
  // back shelving (decor)
  box(s*21.3,1.3,zc,1,2.6,12,mat(0xffffff),true);
  for(let k=0;k<10;k++){ const c=new THREE.Color().setHSL(Math.random(),.45,.6); box(s*20.9,.5+Math.floor(k/5)*1.1+.35, zc-4.8+(k%5)*2.4, .5,.6,1.4, mat(c), false); }
  // counter
  box(s*19,0.55,zc+7.6,3.2,1.1,1.2,mat(col.clone().lerp(new THREE.Color(0x222222),.2)),true);
  // light
  const pl = new THREE.PointLight(0xfff1dc, .55, 22); pl.position.set(s*14,5.2,zc); scene.add(pl);
  // pedestals + products
  const spots = [[4,-5],[4,5],[9,-6.5],[9,6.5],[11.5,0]];
  st.items.forEach((it,i)=>{
    const [dx,dz] = spots[i];
    const px = s*(6+dx), pz = zc+dz;
    box(px,.5,pz,1.5,1,1.5,mat(0xffffff,{roughness:.4}),true);
    box(px,1.02,pz,1.55,.06,1.55,mat(col),false);
    const g = it.g; let geo, h;
    if(g[0]==='box'){ geo=new THREE.BoxGeometry(g[1],g[2],g[3]); h=g[2]; }
    else if(g[0]==='cyl'){ geo=new THREE.CylinderGeometry(g[1],g[1],g[2],28); h=g[2]; }
    else if(g[0]==='sphere'){ geo=new THREE.SphereGeometry(g[1],28,18); h=g[1]*2; }
    else if(g[0]==='cone'){ geo=new THREE.ConeGeometry(g[1],g[2],g[3]||28); h=g[2]; }
    else if(g[0]==='torus'){ geo=new THREE.TorusGeometry(g[1],g[2],14,32,Math.PI); h=g[2]*2; }
    let mesh;
    if(g[0]==='plant'){
      mesh = new THREE.Group();
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(.22,.17,.3,20), mat(0xc9683f)); pot.position.y=.15; mesh.add(pot);
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(.3,16,12), mat(0x3f9a4f)); leaf.position.y=.5; mesh.add(leaf);
      mesh.position.set(px,1.05,pz); h=0;
      mesh.children.forEach(ch=>{ ch.userData.item=it; ch.userData.store=st; ch.userData.root=mesh; clickables.push(ch); });
    } else {
      mesh = new THREE.Mesh(geo, mat(it.c,{roughness:.45}));
      if(g[0]==='cyl' && g[3]==='flat'){ mesh.rotation.z=Math.PI/2; mesh.rotation.y=Math.PI/2; h=g[1]*2; }
      mesh.position.set(px,1.05+h/2,pz);
      mesh.userData.item=it; mesh.userData.store=st; mesh.userData.root=mesh; clickables.push(mesh);
    }
    scene.add(mesh); spinners.push(mesh);
    const tag = new THREE.Sprite(new THREE.SpriteMaterial({map:textTexture(fmt(it.p),'#1f1b2e','#ffffff',256,96,'700 60px Outfit, system-ui, sans-serif')}));
    tag.scale.set(.75,.28,1); tag.position.set(px,1.05+(h||.8)+.45,pz); scene.add(tag);
  });
});

// Fountain, benches, planters
const stone = mat(0xd5cab8);
const basin = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.4,.6,40), stone); basin.position.set(0,.3,0); scene.add(basin);
const water = new THREE.Mesh(new THREE.CylinderGeometry(2,2,.05,40), mat(0x6fb6d8,{roughness:.1,metalness:.2})); water.position.set(0,.56,0); scene.add(water);
const col1 = new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,1.8,20), stone); col1.position.set(0,1.2,0); scene.add(col1);
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(.8,.3,.3,30), stone); bowl.position.set(0,2.1,0); scene.add(bowl);
colliders.push({x0:-2.4,x1:2.4,z0:-2.4,z1:2.4});
const benchMat = mat(0x8a5a3b);
[[-4.4,-15],[4.4,-15],[-4.4,15],[4.4,15]].forEach(([x,z])=>{ box(x,.45,z,.7,.12,2.4,benchMat,true); box(x,.2,z-1,.6,.4,.15,mat(0x444444),false); box(x,.2,z+1,.6,.4,.15,mat(0x444444),false); });
[[-4.6,-6],[4.6,-6],[-4.6,6],[4.6,6],[-4.6,-25],[4.6,-25],[-4.6,25],[4.6,25]].forEach(([x,z])=>{
  box(x,.4,z,1,.8,1,mat(0xb9a88f),true);
  const t = new THREE.Mesh(new THREE.SphereGeometry(.75,16,12), mat(0x4f9a5a)); t.position.set(x,1.4,z); scene.add(t);
});

// ---------- Player ----------
const player = {x:0, z:26, yaw:0, pitch:-0.05};
const R = .4;
function blocked(x,z){ for(const c of colliders){ if(x+R>c.x0 && x-R<c.x1 && z+R>c.z0 && z-R<c.z1) return true; } return false; }
function move(dx,dz){
  if(!blocked(player.x+dx, player.z)) player.x+=dx;
  if(!blocked(player.x, player.z+dz)) player.z+=dz;
}

const keys = {};
addEventListener('keydown', e=>{ if(e.target.closest && e.target.closest('#card a,button')) return; keys[e.code]=true; if(e.code==='Escape') closeCard(); });
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

// ---------- Pointer ----------
const ray = new THREE.Raycaster(); ray.far = 14;
const ndc = new THREE.Vector2();
function pick(cx,cy){
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  return hit ? hit.object : null;
}
const pointers = new Map();
let stickVec = {x:0,y:0};
const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
canvas.addEventListener('pointerdown', e=>{
  canvas.focus({preventScroll:true});
  const touchMove = e.pointerType==='touch' && e.clientX < innerWidth/2 && e.clientY > innerHeight*.35;
  pointers.set(e.pointerId, {sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY, t:performance.now(), mode: touchMove?'stick':'look', moved:0});
  if(touchMove){ stickEl.style.left=e.clientX+'px'; stickEl.style.top=e.clientY+'px'; stickEl.hidden=false; }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p){ if(e.pointerType==='mouse') hover(e.clientX,e.clientY); return; }
  const dx=e.clientX-p.lx, dy=e.clientY-p.ly; p.lx=e.clientX; p.ly=e.clientY;
  p.moved = Math.max(p.moved, Math.hypot(e.clientX-p.sx, e.clientY-p.sy));
  if(p.mode==='look'){
    const k = e.pointerType==='touch' ? .006 : .0045;
    player.yaw -= dx*k; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy*k));
    hideTip();
  } else {
    let vx=e.clientX-p.sx, vy=e.clientY-p.sy; const L=Math.hypot(vx,vy), m=45;
    if(L>m){ vx*=m/L; vy*=m/L; }
    knob.style.transform=`translate(${vx}px,${vy}px)`;
    stickVec={x:vx/m, y:vy/m};
  }
});
function endPointer(e){
  const p = pointers.get(e.pointerId); if(!p) return;
  pointers.delete(e.pointerId);
  if(p.mode==='stick'){ stickVec={x:0,y:0}; knob.style.transform=''; stickEl.hidden=true; }
  if(e.type==='pointerup' && p.moved<8 && performance.now()-p.t<500){
    const o = pick(e.clientX,e.clientY);
    if(o) openCard(o.userData.item, o.userData.store); else closeCard();
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

const tip = document.getElementById('tip');
let hovered = null;
function setHover(o){
  const root = o ? o.userData.root : null;
  if(hovered===root) return;
  const paint = (r,v)=> r && (r.isGroup ? r.children : [r]).forEach(m=>m.material.emissive.setHex(v));
  paint(hovered,0x000000); hovered=root; paint(hovered,0x3a2a1a);
  canvas.style.cursor = root ? 'pointer' : 'grab';
}
function hover(x,y){
  const o = pick(x,y); setHover(o);
  if(o){ tip.textContent = o.userData.item.n+' · '+fmt(o.userData.item.p); tip.style.left=x+'px'; tip.style.top=y+'px'; tip.hidden=false; }
  else hideTip();
}
function hideTip(){ tip.hidden=true; }
canvas.addEventListener('pointerleave', ()=>{ hideTip(); setHover(null); });

// ---------- Card ----------
const card = document.getElementById('card');
function openCard(it, st){
  document.getElementById('cardStore').textContent = st.name;
  document.getElementById('cardStore').style.color = st.color;
  document.getElementById('cardName').textContent = it.n;
  document.getElementById('cardPrice').textContent = fmt(it.p);
  document.getElementById('cardDesc').textContent = it.d;
  const a = document.getElementById('cardLink');
  a.href = 'https://www.amazon.com/s?k='+encodeURIComponent(it.q);
  a.style.background = st.color;
  card.hidden = false; hideTip();
}
function closeCard(){ card.hidden = true; }
document.getElementById('close').addEventListener('click', ()=>{ closeCard(); canvas.focus(); });

// ---------- Directory ----------
const dir = document.getElementById('dir'), dirBtn = document.getElementById('dirBtn');
const list = document.getElementById('dirList');
STORES.forEach(st=>{
  const li=document.createElement('li'); const b=document.createElement('button'); b.className='go';
  b.innerHTML = `<span class="sw" style="background:${st.color}"></span><span></span><small></small>`;
  b.children[1].textContent = st.name; b.children[2].textContent = st.tag;
  b.addEventListener('click', ()=>{ player.x = st.side*3.2; player.z = st.zc; player.yaw = -st.side*Math.PI/2; player.pitch=-0.05; toggleDir(false); closeCard(); canvas.focus(); });
  li.appendChild(b); list.appendChild(li);
});
function toggleDir(v){ dir.hidden = !v; dirBtn.setAttribute('aria-expanded', String(v)); }
dirBtn.addEventListener('click', ()=> toggleDir(dir.hidden));

// ---------- Minimap ----------
const map = document.getElementById('map'), mg = map.getContext('2d');
function drawMap(){
  const W=map.width, H=map.height, pad=12, sx=(W-2*pad)/44, sz=(H-2*pad)/60;
  const X = x=> pad+(x+22)*sx, Z = z=> pad+(z+30)*sz;
  mg.clearRect(0,0,W,H);
  mg.fillStyle='#efe6d8'; mg.fillRect(X(-6),Z(-30),12*sx,60*sz);
  STORES.forEach(st=>{
    const x0 = st.side<0 ? -22 : 6;
    mg.fillStyle = st.color+'33'; mg.fillRect(X(x0),Z(st.zc-10),16*sx,20*sz);
    mg.strokeStyle = st.color; mg.lineWidth=2; mg.strokeRect(X(x0)+1,Z(st.zc-10)+1,16*sx-2,20*sz-2);
  });
  mg.fillStyle='#6fb6d8'; mg.beginPath(); mg.arc(X(0),Z(0),2.2*sx,0,7); mg.fill();
  const px=X(player.x), pz=Z(player.z);
  const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw);
  mg.fillStyle='rgba(217,87,43,.25)'; mg.beginPath(); mg.moveTo(px,pz);
  mg.arc(px,pz,26,Math.atan2(fz,fx)-.5,Math.atan2(fz,fx)+.5); mg.closePath(); mg.fill();
  mg.fillStyle='#1f1b2e'; mg.beginPath(); mg.arc(px,pz,6,0,7); mg.fill();
  mg.strokeStyle='#fff'; mg.lineWidth=2; mg.stroke();
}

// ---------- Where am I ----------
const where = document.getElementById('where');
let lastWhere = '';
function updateWhere(){
  let txt = '';
  if(Math.abs(player.x)>6.2){ const st = STORES.find(s=> s.side===Math.sign(player.x) && Math.abs(player.z-s.zc)<10); if(st) txt = 'In '+st.name; }
  if(txt!==lastWhere){ lastWhere=txt; where.hidden=!txt; where.textContent=txt; }
}

// ---------- Help text for touch ----------
if(matchMedia('(pointer: coarse)').matches){
  document.getElementById('help').textContent = 'Left thumb to walk · drag right side to look · tap a product';
}

// ---------- Loop ----------
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last=now; t+=dt;
  let f=0, r=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD) r+=1; if(keys.KeyA) r-=1;
  if(keys.ArrowLeft) player.yaw += 1.8*dt; if(keys.ArrowRight) player.yaw -= 1.8*dt;
  f -= stickVec.y; r += stickVec.x;
  const len = Math.hypot(f,r);
  if(len>.05){
    if(len>1){ f/=len; r/=len; }
    const sp = (keys.ShiftLeft||keys.ShiftRight ? 9 : 5)*dt;
    const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    move((-sy*f + cy*r)*sp, (-cy*f - sy*r)*sp);
  }
  camera.position.set(player.x, 1.65 + (len>.05 ? Math.sin(t*9)*.03 : 0), player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  if(!reduceMotion) spinners.forEach((m,i)=>{ m.rotation.y += dt*.6; });
  water.position.y = .56 + (reduceMotion?0:Math.sin(t*2)*.01);
  renderer.render(scene,camera);
  drawMap(); updateWhere();
  requestAnimationFrame(frame);
}
document.getElementById('loading').hidden = true;
canvas.style.cursor='grab';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
